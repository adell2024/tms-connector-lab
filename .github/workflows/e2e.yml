name: E2E

on:
  push:
    branches: [main]

jobs:
  e2e:
    name: E2E (json-server + webhooks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install json-server
        run: npm install -g json-server

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Make E2E script executable
        run: chmod +x run_e2e_test.sh

      - name: Run E2E test
        run: ./run_e2e_test.sh
